# push のたびに「前回そのプラットフォームを出したリリースから変更があった部分」だけをビルドし、
# alpha-<UTC タイムスタンプ (ISO 8601 基本形式)> のリリースに、できた順にアップロードする。
#
# - prepare : 変更検出 (.github/scripts/plan.py) とリリース作成
# - test    : ビルドと並行して実行。各ビルドはアップロード直前に test の成功を待つ
# - 各ビルド: 変更があったものだけ実行し、終わり次第アップロード (.github/scripts/publish.sh)
# - finalize: リリースノート作成。何も上がらなかったリリースは削除 (.github/scripts/finalize.py)
#
# アセット名を変えるときは lib/update/updater.dart と .github/scripts/*.py も揃えること。
name: Build & Release

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force_all:
        description: '変更の有無に関係なく全部ビルドする'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
      any: ${{ steps.plan.outputs.any }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
      host: ${{ steps.plan.outputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          # Git のタグ名には ':' を使えないため、ISO 8601 の基本形式 (区切り記号なし) を使う
          echo "tag=alpha-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          echo "build_name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: python3 .github/scripts/plan.py
      - name: Create release
        if: steps.plan.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # main のビルドだけを通常のリリースにし、他のブランチは prerelease にする。
          # アプリ内アップデートは既定で通常のリリースだけを対象にする (lib/update/updater.dart)
          prerelease=--prerelease
          if [ "$GITHUB_REF_NAME" = main ]; then prerelease=; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" $prerelease --notes "ビルド中… できたものから順に追加されます。"

  test:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Host (analyze)
        working-directory: host
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos

  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 が未設定のため一時的な debug 鍵で署名します。アプリ内アップデートで APK を上書きできません (README 参照)。"
          fi
          # 現行の Android 端末はほぼ arm64。main ではエミュレーターや x86 端末向けに x86_64 も含め、
          # それ以外のブランチは arm64 だけにしてビルド時間を削る。32bit ARM は省く
          # (同梱 ABI は android/app/build.gradle.kts がビルド対象に揃える)
          platforms=android-arm64
          if [ "$GITHUB_REF_NAME" = main ]; then platforms=android-arm64,android-x64; fi
          flutter build apk --release --target-platform "$platforms" \
            --build-name=${{ needs.prepare.outputs.build_name }} \
            --build-number=${{ needs.prepare.outputs.build_number }} \
            --dart-define=APP_VERSION=$TAG \
            --dart-define=UPDATE_REPO=${{ github.repository }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/stollmly-android.apk
      - run: bash .github/scripts/publish.sh dist/stollmly-android.apk

  linux:
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # apt-get update (約 40 秒) を避けるため、パッケージをキャッシュする
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev liblzma-dev libstdc++-12-dev ninja-build
          version: 1.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        run: |
          flutter build linux --release \
            --build-name=${{ needs.prepare.outputs.build_name }} \
            --build-number=${{ needs.prepare.outputs.build_number }} \
            --dart-define=APP_VERSION=$TAG \
            --dart-define=UPDATE_REPO=${{ github.repository }}
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/stollmly-linux-x64.tar.gz .
      - run: bash .github/scripts/publish.sh dist/stollmly-linux-x64.tar.gz

  windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ needs.prepare.outputs.build_name }} `
            --build-number=${{ needs.prepare.outputs.build_number }} `
            --dart-define=APP_VERSION=$env:TAG `
            --dart-define=UPDATE_REPO=${{ github.repository }}
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\stollmly-windows-x64.zip
      - shell: bash
        run: bash .github/scripts/publish.sh dist/stollmly-windows-x64.zip

  macos:
    needs: prepare
    if: needs.prepare.outputs.macos == 'true'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        run: |
          flutter build macos --release \
            --build-name=${{ needs.prepare.outputs.build_name }} \
            --build-number=${{ needs.prepare.outputs.build_number }} \
            --dart-define=APP_VERSION=$TAG \
            --dart-define=UPDATE_REPO=${{ github.repository }}
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/stollmly.app dist/stollmly-macos.zip
      - run: bash .github/scripts/publish.sh dist/stollmly-macos.zip

  ios:
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.prepare.outputs.build_name }} \
            --build-number=${{ needs.prepare.outputs.build_number }} \
            --dart-define=APP_VERSION=$TAG \
            --dart-define=UPDATE_REPO=${{ github.repository }}
          mkdir -p dist ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry ../dist/stollmly-ios-unsigned.ipa Payload)
      - run: bash .github/scripts/publish.sh dist/stollmly-ios-unsigned.ipa

  host:
    needs: prepare
    if: needs.prepare.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: stollmly-host-linux-x64
          - os: macos-latest
            out: stollmly-host-macos-arm64
          - os: windows-latest
            out: stollmly-host-windows-x64.exe
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # ホストは依存なしの Dart なので Flutter ではなく Dart SDK だけで足りる (セットアップが速い)
      - uses: dart-lang/setup-dart@v1
      - name: Build host
        shell: bash
        working-directory: host
        run: |
          dart pub get
          mkdir -p ../dist
          dart compile exe bin/stollmly_host.dart -o ../dist/${{ matrix.out }}
      - shell: bash
        run: bash .github/scripts/publish.sh dist/${{ matrix.out }}

  finalize:
    needs: [prepare, test, android, linux, windows, macos, ios, host]
    if: always() && needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/finalize.py
